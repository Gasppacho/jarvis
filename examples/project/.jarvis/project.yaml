apiVersion: jarvis.dev/project/v1
kind: Project
compositionMode: fixed-modules
metadata:
  id: token-warehouse
  name: Token Warehouse
  description: Example GitHub project using a project-bound coding runtime.
repositories:
  - id: main
    root: .
slots:
  sourceControl:
    requires: scm.change-request.manage
  tickets:
    requires: work-items.read
  agentRuntime:
    requires: agent.execute
modules:
  - instanceId: github
    moduleId: jarvis.module.github
    enabled: true
    bindings:
      sourceControl: sourceControl
      tickets: tickets
    configuration:
      bootstrapLabelPolicy: ignore-existing
      pollIntervalSeconds: 60
      repositories:
        - main
  - instanceId: development
    moduleId: jarvis.module.development
    enabled: true
    runtimeSlot: agentRuntime
    bindings:
      tickets: tickets
      repository: main
    configuration:
      readyLabel: ready-to-dev
  - instanceId: pull-request
    moduleId: jarvis.module.pull-request
    enabled: true
    runtimeSlot: agentRuntime
    bindings:
      repository: main
      sourceControl: sourceControl
