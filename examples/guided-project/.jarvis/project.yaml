apiVersion: jarvis.dev/project/v1
kind: Project
metadata:
  id: guided-project
  name: Guided Project
  description: Example GitHub project using a project-bound coding runtime.
repositories:
  - id: main
    root: .
    defaultBranch: main
    remote: origin
slots:
  sourceControl:
    requires: scm.change-request.manage
  tickets:
    requires: work-items.read
  agentRuntime:
    requires: agent.execute
commands:
  install: pnpm install --frozen-lockfile
  verify: pnpm verify
git:
  branchPattern: agent/{workItemId}-{slug}
  commitStrategy: conventional
  pushRemote: origin
  allowForcePush: false
workspace:
  strategy: git-worktree
  maxConcurrentExecutions: 1
  retainOnFailureDays: 7
modules:
  - instanceId: github
    moduleId: jarvis.module.github
    enabled: true
    bindings:
      sourceControl: sourceControl
      tickets: tickets
    configuration:
      readyLabel: ready-for-agent
      bootstrapLabelPolicy: ignore-existing
      pollIntervalSeconds: 60
      repositories:
        - main
  - instanceId: automation-rules
    moduleId: jarvis.module.automation-rules
    enabled: true
    configuration:
      rules:
        - id: ready-label-starts-development
          when:
            eventType: scm.work-item.ready
            equals:
              payload.tag: ready-for-agent
          emit:
            type: development.implementation.requested
            target:
              moduleInstanceId: development
  - instanceId: development
    moduleId: jarvis.module.development
    enabled: true
    runtimeSlot: agentRuntime
    bindings:
      tickets: tickets
      repository: main
      sourceControl: sourceControl
    configuration:
      preparation: install
      validationOrder:
        - verify
      maxRepairCycles: 2
      retainWorkspaceOnSuccess: false
      timeoutMs: 300000
      outputLimitBytes: 1048576
      environmentAllowlist: []
