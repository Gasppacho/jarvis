apiVersion: jarvis.dev/module/v1
kind: Module
metadata:
  id: jarvis.module.automation-rules
  version: 1.0.0
  displayName: Automation Rules
  description: Translates matching project Facts into targeted Requests.
  categories:
    - automation
runtime:
  entrypoint: dist/index.js
  engineRange: ">=1.0.0 <2.0.0"
  concurrency: 8
  partitionBy: subject.ref
contracts:
  consumes:
    - type: scm.work-item.tag-added
      version: 1
      kind: fact
      schemaRef: contracts/events/scm.work-item.tag-added.v1.schema.json
      handler: handleWorkItemTagAdded
  produces:
    - type: development.implementation.requested
      version: 1
      kind: request
      schemaRef: contracts/events/development.implementation.requested.v1.schema.json
capabilities:
  requires: []
  provides: []
configuration:
  schemaRef: contracts/module-config/automation-rules.v1.schema.json
permissions:
  emit:
    - development.implementation.requested
