openapi: 3.1.0
info:
  title: Jarvis Local API
  version: 1.0.0
  description: Loopback-only API between the native macOS shell and the embedded engine.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "43127"
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Engine health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/discovery/repository:
    post:
      operationId: discoverRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: Read-only discovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiscovery"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects known by this installation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: importProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repositoryPath]
              properties:
                repositoryPath:
                  type: string
                portableConfig:
                  $ref: "#/components/schemas/PortableProjectConfiguration"
      responses:
        "201":
          description: Imported draft project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteProject
      description: Forgets an inactive Project and its local engine state without modifying its repository.
      responses:
        "204":
          description: Project and cascading Local Bindings deleted.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/repositories/{repositoryId}/binding:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: repositoryId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateRepositoryBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, bookmarkRef]
              properties:
                path:
                  type: string
                  minLength: 1
                bookmarkRef:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        "200":
          description: Project detail with the resolved Local Binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/validate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: validateProject
      deprecated: true
      responses:
        "200":
          description: Legacy composition validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/validation-report:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: generateProjectValidationReportV1
      responses:
        "200":
          description: Versioned composition validation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectValidationReportV1"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/composition-choices:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: previewProjectCompositionChoicesV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [portableConfig]
              properties:
                portableConfig:
                  oneOf:
                    - $ref: "#/components/schemas/PortableProjectDraft"
                    - $ref: "#/components/schemas/PortableProjectConfiguration"
      responses:
        "200":
          description: Deterministic Event choices for the saved or proposed Portable Configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompositionChoicesV1"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/composition-review:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: reviewProjectCompositionV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [portableConfig]
              properties:
                portableConfig:
                  oneOf:
                    - $ref: "#/components/schemas/PortableProjectDraft"
                    - $ref: "#/components/schemas/PortableProjectConfiguration"
      responses:
        "200":
          description: Read-only Engine-owned review of the saved or proposed composition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompositionReviewV1"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/composition-graph:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: projectCompositionGraph
      description: >-
        Returns the Engine-owned composition graph read model for the Project's
        saved composition, or for the proposed configuration evaluated against
        the current Local Bindings when a body is supplied. The graph exposes
        Module Instance nodes, event-contract edges, the capability/slot/binding
        rail, and the validator's routing decision for every request edge.
        Read-only: nothing is persisted or mutated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [portableConfig]
              properties:
                portableConfig:
                  oneOf:
                    - $ref: "#/components/schemas/PortableProjectDraft"
                    - $ref: "#/components/schemas/PortableProjectConfiguration"
      responses:
        "200":
          description: The derived composition graph read model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCompositionGraphV1"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/activate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: activateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [compositionFingerprint]
              properties:
                compositionFingerprint:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: >-
                    The `compositionFingerprint` from a successful
                    `ProjectValidationReportV1` for this Project's composition
                    saved right now.
      responses:
        "200":
          description: Activated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/pause:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: pauseProject
      responses:
        "200":
          description: Paused project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/modules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectModules
      responses:
        "200":
          description: Module instances and validation status.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectEvents
      parameters:
        - name: correlationId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Durable event timeline.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/executions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectExecutions
      responses:
        "200":
          description: Project executions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/executions/{executionId}/cancel:
    post:
      operationId: cancelExecution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSummary"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/connections:
    get:
      operationId: listConnections
      responses:
        "200":
          description: Global connection descriptors without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: upsertConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, kind, displayName, secretRef]
              properties:
                id:
                  type: string
                kind:
                  type: string
                displayName:
                  type: string
                secretRef:
                  type: string
                configuration:
                  type: object
      responses:
        "201":
          description: Connection descriptor without secret value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDescriptor"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/runtimes:
    get:
      operationId: listRuntimes
      responses:
        "200":
          description: Detected agent runtimes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/stream:
    get:
      operationId: streamUpdates
      responses:
        "200":
          description: Server-sent event stream. Each data field is a StreamMessage JSON object.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/system/shutdown:
    post:
      operationId: shutdownEngine
      responses:
        "202":
          description: Graceful shutdown started.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/module-catalog:
    get:
      operationId: listModuleCatalog
      responses:
        "200":
          description: Bundled validated Module Packages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModulePackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/configuration:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      operationId: replaceProjectConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [portableConfig, writeToRepository]
              properties:
                portableConfig:
                  oneOf:
                    - $ref: "#/components/schemas/PortableProjectDraft"
                    - $ref: "#/components/schemas/PortableProjectConfiguration"
                writeToRepository:
                  type: boolean
      responses:
        "200":
          description: Updated draft Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/bindings:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectBindings
      responses:
        "200":
          description: Local Project Bindings without secret values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBindings"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: replaceProjectBindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectBindings"
      responses:
        "200":
          description: Updated Local Bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBindings"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/binding-candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectBindingCandidates
      responses:
        "200":
          description: Project-scoped eligible resources and Engine-owned Slot repair guidance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResourceChoices"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: previewProjectBindingCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [portableConfig]
              properties:
                portableConfig:
                  $ref: "#/components/schemas/PortableProjectConfiguration"
      responses:
        "200":
          description: Read-only resource eligibility preview for a proposed Portable Configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResourceChoices"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/graph:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectGraph
      responses:
        "200":
          description: Emergent graph derived from active Module contracts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGraph"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/projects/{projectId}/dead-letters:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectDeadLetters
      responses:
        "200":
          description: Dead Letters for one Project.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeadLetter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dead-letters/{deliveryId}/replay:
    post:
      operationId: replayDeadLetter
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Replay accepted with original idempotency semantics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSummary"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/connections/{connectionId}/validate:
    post:
      operationId: validateConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection health descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDescriptor"
        default:
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/runtimes/discover:
    post:
      operationId: discoverRuntimes
      responses:
        "200":
          description: Refreshed runtime descriptors.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/diagnostics:
    post:
      operationId: createDiagnosticBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                projectIds:
                  type: array
                  items:
                    type: string
                includeAgentTranscripts:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Redacted diagnostic Artifact.
          content:
            application/json:
              schema:
                type: object
                required: [artifactRef]
                properties:
                  artifactRef:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid session bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The request did not address the loopback interface. The engine binds
        127.0.0.1 only and rejects any other Host, per SYSTEM.md.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, engineVersion, apiVersion, database]
      properties:
        status:
          type: string
          enum: [ready, degraded, shutting-down]
        engineVersion:
          type: string
        apiVersion:
          type: string
          const: v1
        database:
          type: string
          enum: [ready, migrating, failed]
    RepositoryDiscovery:
      type: object
      additionalProperties: false
      required: [isGitRepository, suggested]
      properties:
        isGitRepository:
          type: boolean
        remoteUrl:
          type: [string, "null"]
        provider:
          type: [string, "null"]
        defaultBranch:
          type: [string, "null"]
        packageManager:
          type: [string, "null"]
        scripts:
          type: object
          additionalProperties:
            type: string
        suggested:
          type: object
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, moduleCount]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, valid, active, paused, invalid, degraded, archived]
        moduleCount:
          type: integer
          minimum: 0
        activeExecutions:
          type: integer
          minimum: 0
    ProjectDetail:
      # Not an allOf on ProjectSummary: that member's `additionalProperties: false`
      # would reject the detail's own `portableConfig`/`bindingStatus` properties,
      # making the schema unsatisfiable. It restates the summary properties instead.
      type: object
      additionalProperties: false
      required: [id, name, status, moduleCount, portableConfig, bindingStatus]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, valid, active, paused, invalid, degraded, archived]
        moduleCount:
          type: integer
          minimum: 0
        activeExecutions:
          type: integer
          minimum: 0
        portableConfig:
          anyOf:
            - $ref: "#/components/schemas/PortableProjectConfiguration"
            - $ref: "#/components/schemas/PortableProjectDraft"
        bindingStatus:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [path, accessible, bookmarkRef]
            properties:
              path:
                type: string
              accessible:
                type: boolean
              bookmarkRef:
                type: [string, "null"]
                description: Opaque reference to bookmark bytes owned by the macOS Shell.
    ValidationContract:
      type: object
      additionalProperties: false
      required: [type, version, kind]
      properties:
        type:
          type: string
        version:
          type: integer
          minimum: 1
        kind:
          enum: [request, fact]
    ValidationInstanceTarget:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId]
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
    ValidationContractEndpoint:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId, contract]
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
        contract:
          $ref: "#/components/schemas/ValidationContract"
    ProjectFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, field]
      properties:
        kind:
          const: project
        field:
          type: string
    RequestEdgeFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, contract, producer]
      properties:
        kind:
          const: request-edge
        contract:
          $ref: "#/components/schemas/ValidationContract"
        producer:
          $ref: "#/components/schemas/ValidationInstanceTarget"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ValidationInstanceTarget"
    ContractEdgeFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, producer, consumer]
      properties:
        kind:
          const: contract-edge
        producer:
          $ref: "#/components/schemas/ValidationContractEndpoint"
        consumer:
          $ref: "#/components/schemas/ValidationContractEndpoint"
    ModuleInstanceFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, instanceId, field]
      properties:
        kind:
          const: module-instance
        instanceId:
          type: string
        field:
          type: string
    SlotFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, slot]
      properties:
        kind:
          const: slot
        slot:
          type: string
    ModuleCapabilityFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, capability, instanceId]
      properties:
        kind:
          const: capability
        capability:
          type: string
        instanceId:
          type: string
        binding:
          type: string
    SlotCapabilityFindingTarget:
      type: object
      additionalProperties: false
      required: [kind, capability, slot]
      properties:
        kind:
          const: capability
        capability:
          type: string
        slot:
          type: string
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
            required: [code, severity, message]
            properties:
              code:
                type: string
              severity:
                type: string
                enum: [error, warning]
              message:
                type: string
              path:
                type: [string, "null"]
    ProjectCompositionChoiceInstance:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId]
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
    ProjectCompositionChoiceConsumer:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId, compatibility]
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
        compatibility:
          enum: [compatible, incompatible]
    ProjectCompositionEventChoice:
      type: object
      additionalProperties: false
      required: [label, type, version, kind, description, payloadSchema, producers, consumers, routing]
      properties:
        label:
          type: string
          minLength: 1
        type:
          type: string
        version:
          type: integer
          minimum: 1
        kind:
          enum: [request, fact]
        description:
          type: string
          minLength: 1
        payloadSchema:
          type: object
          additionalProperties: true
        producers:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionChoiceInstance"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionChoiceConsumer"
        routing:
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, explanation]
              properties:
                status:
                  enum: [broadcast, orphaned, ambiguous]
                explanation:
                  type: string
                  minLength: 1
            - type: object
              additionalProperties: false
              required: [status, selectedConsumer, explanation]
              properties:
                status:
                  const: resolved
                selectedConsumer:
                  $ref: "#/components/schemas/ProjectCompositionChoiceInstance"
                explanation:
                  type: string
                  minLength: 1
    ProjectCompositionStartingPoint:
      type: object
      additionalProperties: false
      required: [id, displayName, description]
      properties:
        id:
          enum: [github-development, custom]
        displayName:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        template:
          $ref: "#/components/schemas/PortableProjectConfiguration"
    ProjectCompositionModuleInstance:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - moduleId
        - enabled
        - version
        - displayName
        - description
        - consumes
        - produces
        - requiredCapabilities
        - compatibility
        - missingResources
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
        enabled:
          type: boolean
        version:
          type: string
        displayName:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        consumes:
          type: array
          items: { type: string }
        produces:
          type: array
          items: { type: string }
        requiredCapabilities:
          type: array
          items: { type: string }
        compatibility:
          enum: [compatible, incompatible]
        missingResources:
          type: array
          items: { type: string }
    ProjectCompositionChoicesV1:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - projectId
        - startingPoints
        - modulePackages
        - moduleInstances
        - choices
      properties:
        apiVersion:
          const: jarvis.dev/project-composition-choices/v1
        kind:
          const: ProjectCompositionChoices
        projectId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        startingPoints:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionStartingPoint"
        modulePackages:
          type: array
          items:
            $ref: "#/components/schemas/ModulePackage"
        moduleInstances:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionModuleInstance"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionEventChoice"
    ProjectCompositionReviewV1:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, projectId, readyToValidate, composition, validation, resources]
      properties:
        apiVersion:
          const: jarvis.dev/project-composition-review/v1
        kind:
          const: ProjectCompositionReview
        projectId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        readyToValidate:
          type: boolean
          description: Engine-owned readiness for the supplied or saved Portable Configuration and current Local Bindings.
        composition:
          $ref: "#/components/schemas/ProjectCompositionChoicesV1"
        validation:
          $ref: "#/components/schemas/ProjectValidationReportV1"
        resources:
          $ref: "#/components/schemas/ProjectResourceChoices"
    ProjectCompositionGraphV1:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, projectId, nodes, edges, rail, findings]
      properties:
        apiVersion:
          type: string
          const: jarvis.dev/project-composition-graph/v1
        kind:
          type: string
          const: ProjectCompositionGraph
        projectId:
          type: string
          minLength: 1
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionGraphNodeV1"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionGraphEdgeV1"
        rail:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionGraphRailItemV1"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCompositionGraphFindingV1"
    ProjectCompositionGraphNodeV1:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId, enabled, moduleVersion, displayName, findings]
      properties:
        instanceId:
          type: string
          minLength: 1
        moduleId:
          type: string
          minLength: 1
        enabled:
          type: boolean
        moduleVersion:
          type: string
          nullable: true
          description: Null while the Module Package is unavailable.
        displayName:
          type: string
          nullable: true
          description: Null while the Module Package is unavailable.
        findings:
          type: array
          items:
            type: string
    ProjectCompositionGraphEdgeV1:
      type: object
      additionalProperties: false
      required: [kind, contract, from, findings]
      properties:
        kind:
          type: string
          enum: [request, fact]
        contract:
          $ref: "#/components/schemas/ValidationContract"
        from:
          $ref: "#/components/schemas/ValidationInstanceTarget"
        to:
          $ref: "#/components/schemas/ValidationInstanceTarget"
          description: Resolved request consumer or fact delivery consumer; absent for unresolved requests.
        routing:
          description: Present on every request edge; facts are broadcast, not routed.
          required: [status]
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, consumer]
              properties:
                status:
                  type: string
                  enum: [resolved]
                consumer:
                  $ref: "#/components/schemas/ValidationInstanceTarget"
            - type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [orphaned]
            - type: object
              additionalProperties: false
              required: [status, candidates]
              properties:
                status:
                  type: string
                  enum: [ambiguous]
                candidates:
                  type: array
                  items:
                    $ref: "#/components/schemas/ValidationInstanceTarget"
        findings:
          type: array
          items:
            type: string
    ProjectCompositionGraphRailItemV1:
      type: object
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, slot, capability, state, findings]
          properties:
            kind:
              type: string
              enum: [slot]
            slot:
              type: string
              minLength: 1
            capability:
              type: string
              minLength: 1
            binding:
              type: object
              additionalProperties: false
              required: [kind, ref]
              properties:
                kind:
                  type: string
                  enum: [connection, runtime, mcp, module-instance, engine]
                ref:
                  type: string
                  minLength: 1
            state:
              type: string
              enum: [bound, unbound, unresolved]
            source:
              type: object
              additionalProperties: false
              required: [kind, ref]
              properties:
                kind:
                  type: string
                  enum: [connection, runtime, mcp, module-instance, engine, repository]
                ref:
                  type: string
                  minLength: 1
            findings:
              type: array
              items:
                type: string
        - type: object
          additionalProperties: false
          required: [kind, instanceId, capability, state, findings]
          properties:
            kind:
              type: string
              enum: [module-instance]
            instanceId:
              type: string
              minLength: 1
            capability:
              type: string
              minLength: 1
            binding:
              type: string
              minLength: 1
            state:
              type: string
              enum: [bound, unbound, unresolved]
            source:
              type: object
              additionalProperties: false
              required: [kind, ref]
              properties:
                kind:
                  type: string
                  enum: [connection, runtime, mcp, module-instance, engine, repository]
                ref:
                  type: string
                  minLength: 1
            findings:
              type: array
              items:
                type: string
    ProjectCompositionGraphFindingV1:
      type: object
      additionalProperties: false
      required: [id, code, severity, message, target]
      properties:
        id:
          type: string
          pattern: "^f[1-9][0-9]*$"
          description: Stable address of this finding inside this response.
        code:
          enum:
            - project.composition-incomplete
            - project.binding-missing
            - project.capability-unresolved
            - project.contract-incompatible
            - project.instance-config-invalid
            - project.module-package-unavailable
            - project.request-ambiguous
            - project.request-orphaned
        severity:
          enum: [error, warning]
        message:
          type: string
          minLength: 1
        target:
          oneOf:
            - $ref: "#/components/schemas/ProjectFindingTarget"
            - $ref: "#/components/schemas/RequestEdgeFindingTarget"
            - $ref: "#/components/schemas/ContractEdgeFindingTarget"
            - $ref: "#/components/schemas/ModuleInstanceFindingTarget"
            - $ref: "#/components/schemas/SlotFindingTarget"
            - $ref: "#/components/schemas/ModuleCapabilityFindingTarget"
            - $ref: "#/components/schemas/SlotCapabilityFindingTarget"
    ProjectValidationReportV1:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, projectId, valid, requestRoutes, satisfiedCapabilities, findings]
      properties:
        apiVersion:
          const: jarvis.dev/project-validation/v1
        kind:
          const: ProjectValidationReport
        projectId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        valid:
          type: boolean
        requestRoutes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [contract, producer, consumer]
            properties:
              contract:
                type: object
                additionalProperties: false
                required: [type, version, kind]
                properties:
                  type:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  kind:
                    const: request
              producer:
                type: object
                additionalProperties: false
                required: [instanceId, moduleId]
                properties:
                  instanceId:
                    type: string
                  moduleId:
                    type: string
              consumer:
                type: object
                additionalProperties: false
                required: [instanceId, moduleId]
                properties:
                  instanceId:
                    type: string
                  moduleId:
                    type: string
        satisfiedCapabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [capability, target, source]
            properties:
              capability:
                type: string
              target:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [kind, instanceId]
                    properties:
                      kind:
                        const: module-instance
                      instanceId:
                        type: string
                  - type: object
                    additionalProperties: false
                    required: [kind, slot]
                    properties:
                      kind:
                        const: slot
                      slot:
                        type: string
              source:
                type: object
                additionalProperties: false
                required: [kind, ref]
                properties:
                  kind:
                    enum: [connection, runtime, mcp, module-instance, engine, repository]
                  ref:
                    type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, severity, message, target]
            properties:
              code:
                enum:
                  - project.composition-incomplete
                  - project.binding-missing
                  - project.capability-unresolved
                  - project.contract-incompatible
                  - project.instance-config-invalid
                  - project.module-package-unavailable
                  - project.request-ambiguous
                  - project.request-orphaned
              severity:
                enum: [error, warning]
              message:
                type: string
                minLength: 1
              target:
                oneOf:
                  - $ref: "#/components/schemas/ProjectFindingTarget"
                  - $ref: "#/components/schemas/RequestEdgeFindingTarget"
                  - $ref: "#/components/schemas/ContractEdgeFindingTarget"
                  - $ref: "#/components/schemas/ModuleInstanceFindingTarget"
                  - $ref: "#/components/schemas/SlotFindingTarget"
                  - $ref: "#/components/schemas/ModuleCapabilityFindingTarget"
                  - $ref: "#/components/schemas/SlotCapabilityFindingTarget"
        compositionFingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "Stable digest of exactly the Portable Configuration and Local Bindings this report describes. POST /v1/projects/{projectId}/activate takes it back and refuses activation when it no longer matches what is saved right now, instead of silently revalidating a stale report."
    ModuleInstance:
      type: object
      required: [instanceId, moduleId, version, enabled, status]
      properties:
        instanceId:
          type: string
        moduleId:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum: [configured, active, degraded, invalid, inactive]
    EventSummary:
      type: object
      required: [id, type, version, kind, occurredAt, producer, correlationId]
      properties:
        id:
          type: string
        type:
          type: string
        version:
          type: integer
        kind:
          type: string
          enum: [request, fact]
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
        correlationId:
          type: string
        causationId:
          type: [string, "null"]
        subjectRef:
          type: string
    ExecutionSummary:
      type: object
      required: [id, projectId, moduleInstanceId, status, attempt, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        moduleInstanceId:
          type: string
        status:
          type: string
          enum: [queued, running, cancelling, completed, failed, cancelled, timed-out]
        attempt:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    ResourceDescriptor:
      type: object
      required: [id, kind, displayName, status, capabilities]
      properties:
        id:
          type: string
        kind:
          type: string
        displayName:
          type: string
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
    StreamMessage:
      type: object
      required: [sequence, type, occurredAt, payload]
      properties:
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
        projectId:
          type: [string, "null"]
        payload:
          type: object
    ModulePackage:
      type: object
      required:
        - moduleId
        - version
        - displayName
        - description
        - categories
        - consumes
        - produces
        - requires
        - provides
        - configurationSchemaRef
        - configurationSchema
      properties:
        moduleId:
          type: string
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
        consumes:
          type: array
          items:
            type: string
        produces:
          type: array
          items:
            type: string
        requires:
          type: array
          items:
            type: string
        provides:
          type: array
          items:
            type: string
        configurationSchemaRef:
          type: [string, "null"]
        configurationSchema:
          type: [object, "null"]
          additionalProperties: true
    ProjectMetadata:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
    ProjectRepositoryConfiguration:
      type: object
      additionalProperties: false
      required: [id, root, defaultBranch, remote]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        root:
          type: string
          const: "."
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 200
        remote:
          type: string
          minLength: 1
          maxLength: 100
    ProjectSlotRequirement:
      type: object
      additionalProperties: false
      required: [requires]
      properties:
        requires:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        optional:
          type: boolean
        description:
          type: string
    ProjectCommands:
      type: object
      additionalProperties: false
      properties:
        install: { type: string, minLength: 1 }
        lint: { type: string, minLength: 1 }
        typecheck: { type: string, minLength: 1 }
        test: { type: string, minLength: 1 }
        build: { type: string, minLength: 1 }
    ProjectGitConfiguration:
      type: object
      additionalProperties: false
      required: [branchPattern, commitStrategy, pushRemote]
      properties:
        branchPattern:
          type: string
          minLength: 1
          maxLength: 200
        commitStrategy:
          enum: [conventional, ticket-prefix, freeform]
        pushRemote:
          type: string
          minLength: 1
        allowForcePush:
          const: false
    ProjectWorkspaceConfiguration:
      type: object
      additionalProperties: false
      required: [strategy, maxConcurrentExecutions, retainOnFailureDays]
      properties:
        strategy:
          const: git-worktree
        maxConcurrentExecutions:
          type: integer
          minimum: 1
          maximum: 16
        retainOnFailureDays:
          type: integer
          minimum: 0
          maximum: 90
    ModuleInstanceConfiguration:
      type: object
      additionalProperties: false
      required: [instanceId, moduleId, enabled]
      properties:
        instanceId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        moduleId:
          type: string
          pattern: "^jarvis\\.module\\.[a-z0-9-]+$"
        enabled:
          type: boolean
        runtimeSlot:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
        bindings:
          type: object
          additionalProperties:
            type: string
            pattern: "^[A-Za-z][A-Za-z0-9._-]*$"
        configuration:
          type: object
          additionalProperties: true
    PortableProjectDraft:
      description: Engine-discovered editable Project draft with empty user composition.
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, repositories, slots, commands, git, workspace, modules]
      properties:
        apiVersion:
          const: jarvis.dev/project/v1
        kind:
          const: Project
        metadata:
          $ref: "#/components/schemas/ProjectMetadata"
        repositories:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/ProjectRepositoryConfiguration"
        slots:
          type: object
          maxProperties: 0
          additionalProperties: false
        commands:
          $ref: "#/components/schemas/ProjectCommands"
        git:
          $ref: "#/components/schemas/ProjectGitConfiguration"
        workspace:
          $ref: "#/components/schemas/ProjectWorkspaceConfiguration"
        modules:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/ModuleInstanceConfiguration"
    PortableProjectConfiguration:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, repositories, slots, commands, git, workspace, modules]
      properties:
        apiVersion:
          const: jarvis.dev/project/v1
        kind:
          const: Project
        metadata:
          $ref: "#/components/schemas/ProjectMetadata"
        repositories:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/ProjectRepositoryConfiguration"
        slots:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/ProjectSlotRequirement"
        commands:
          $ref: "#/components/schemas/ProjectCommands"
        git:
          $ref: "#/components/schemas/ProjectGitConfiguration"
        workspace:
          $ref: "#/components/schemas/ProjectWorkspaceConfiguration"
        modules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ModuleInstanceConfiguration"
    ProjectRepositoryBinding:
      type: object
      additionalProperties: false
      required: [path, bookmarkRef]
      properties:
        path:
          type: string
          minLength: 1
        bookmarkRef:
          type: [string, "null"]
          minLength: 1
    ProjectResourceCandidate:
      type: object
      additionalProperties: false
      required: [ref, kind, displayName, capabilities]
      properties:
        ref:
          type: string
        kind:
          type: string
          enum: [connection, runtime, mcp, module-instance, engine]
        displayName:
          type: string
        capabilities:
          type: array
          items:
            type: string
    ProjectResourceChoices:
      type: object
      additionalProperties: false
      required: [items, slots]
      properties:
        items:
          description: Deduplicated union of resources eligible for at least one Slot.
          type: array
          items:
            $ref: "#/components/schemas/ProjectResourceCandidate"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResourceBindingChoice"
    ProjectResourceBindingChoice:
      type: object
      additionalProperties: false
      required: [slotId, requiredCapabilities, candidates, status, impact, repairAction]
      properties:
        slotId:
          type: string
        requiredCapabilities:
          type: array
          minItems: 1
          items:
            type: string
        candidates:
          description: Only explicitly project-scoped resources satisfying every Slot and Module Instance requirement.
          type: array
          items:
            $ref: "#/components/schemas/ProjectResourceCandidate"
        status:
          type: string
          enum: [bound, available, missing, inaccessible, incompatible]
        impact:
          type: string
          minLength: 1
        repairAction:
          type: string
          minLength: 1
    ProjectSlotBinding:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [connection, runtime, mcp, module-instance, engine]
        ref:
          type: string
          minLength: 1
          maxLength: 300
    ProjectBindings:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, projectId, repositories, slots]
      properties:
        apiVersion:
          const: jarvis.dev/project-bindings/v1
        kind:
          const: ProjectBindings
        projectId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        repositories:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/ProjectRepositoryBinding"
        slots:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProjectSlotBinding"
    ProjectGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges, valid, issues]
      properties:
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
    DeadLetter:
      type: object
      required: [deliveryId, projectId, eventId, moduleInstanceId, code, attempts, createdAt]
      properties:
        deliveryId:
          type: string
        projectId:
          type: string
        eventId:
          type: string
        moduleInstanceId:
          type: string
        code:
          type: string
        message:
          type: string
        attempts:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            correlationId:
              type: string
